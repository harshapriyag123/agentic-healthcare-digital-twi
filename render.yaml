services:
  - type: web
    name: geotwin-sentinel-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_ENV
        value: production
      - key: VITE_APP_VERSION
        value: 0.1.0-demo
      - key: VITE_DEPLOYMENT_NAME
        value: GeoTwin Sentinel Hackathon Demo
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/liberty
      - key: VITE_SIGNOZ_APP_URL
        sync: false
      - key: VITE_SIGNOZ_DASHBOARD_URL
        sync: false

  - type: web
    name: geotwin-sentinel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        value: "*.onrender.com"
      - key: MAX_REQUEST_BODY_BYTES
        value: "1048576"
      - key: OTEL_ENABLED
        value: "true"
      - key: OTEL_SERVICE_NAME
        value: geotwin-api
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_INSECURE
        value: "false"
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_RESOURCE_ATTRIBUTES
        value: deployment.platform=render
