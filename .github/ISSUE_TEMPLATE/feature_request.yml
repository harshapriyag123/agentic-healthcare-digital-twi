name: Feature request
description: Propose a scoped product or research capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What user or research need is unmet?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed change, description: Describe behavior without presenting future work as implemented.}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: Safety, trust, and observability impact, description: Address synthetic-data boundaries, human review, evidence, and telemetry.}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives and tests}
